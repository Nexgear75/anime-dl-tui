name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # prepack builds dist/; the asset keeps a fixed name so that
      # releases/latest/download/anime-dl-tui.tgz always points to the newest one.
      - run: npm pack && mv anime-dl-tui-*.tgz anime-dl-tui.tgz
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" anime-dl-tui.tgz --title "$GITHUB_REF_NAME" --generate-notes
